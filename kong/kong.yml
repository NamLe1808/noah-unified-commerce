_format_version: "3.0"

services:
  - name: order-api-service
    url: http://order_api:5000
    routes:
      - name: order-api-route
        paths:
          - /orders
        strip_path: true
        methods:
          - POST
          - GET

  - name: report-service
    url: http://report_service:5001
    routes:
      - name: report-route
        paths:
          - /report
        strip_path: true
        methods:
          - GET

plugins:
  - name: key-auth
    service: order-api-service

  - name: key-auth
    service: report-service

  - name: rate-limiting
    service: order-api-service
    config:
      minute: 10
      policy: local

  - name: rate-limiting
    service: report-service
    config:
      minute: 10
      policy: local

consumers:
  - username: noah-client
    keyauth_credentials:
      - key: noah-secret-key
