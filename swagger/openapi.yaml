openapi: 3.0.3
info:
  title: NOAH Unified Commerce Gateway API
  version: 1.0.0
  description: API exposed through Kong Gateway with API key authentication and rate limiting.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
security:
  - ApiKeyAuth: []
paths:
  /orders/api/orders:
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, product_id, quantity]
              properties:
                user_id:
                  type: integer
                  example: 1
                product_id:
                  type: integer
                  example: 101
                quantity:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Order received
        '202':
          description: Order accepted
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limit exceeded

  /report/api/report:
    get:
      summary: Get stitched commerce report
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Report data
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limit exceeded
